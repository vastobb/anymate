name: Build AnyMate APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Stage APKs
        run: |
          mkdir -p dist/debug dist/release
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_NAME="AnyMate-${{ github.ref_name }}.apk"
          else
            RELEASE_NAME="AnyMate-${{ github.sha }}.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/debug/AnyMate-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/release/$RELEASE_NAME"
          ls -lh dist/debug dist/release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AnyMate-debug-apk
          path: dist/debug/AnyMate-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AnyMate-apk
          path: dist/release/AnyMate-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AnyMate ${{ github.ref_name }}
          body: |
            **AnyMate** — a 2D animation studio for Android that you and your AI agent drive together.

            • Touch-first studio: pencil, ink pen, brush, eraser, flood fill, shapes, type, layers, onion skin
            • 12 / 24 / 30 / 60 fps playback, built to absorb 60+ frame writes per second
            • A real **MCP server** inside the app — ~60 drawing, frame, animation and export tools
            • **Human drawing** tools: strokes, shapes and figures with wobble, taper and overshoot,
              from an `easy` block-in to `detailed` line art
            • **Frame surgery**: place bitmap frames, mirror/rotate/scale, recolour, reverse, hold and tween
            • Animated GIF / PNG / PNG-sequence export, plus shareable `.anymate` project files
            • New UI: live MCP status pill, blank-canvas quick start, cleaner landscape chrome

            **Install:** download the APK below and sideload it (allow "install from unknown sources").
            The CI build is signed with the CI debug key for easy testing.

            Docs: https://github.com/vastobb/anymate/blob/main/docs/MCP.md
          files: dist/release/AnyMate-*.apk
          generate_release_notes: true
